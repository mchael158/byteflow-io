[package]
name = "byteflow-io"
version = "0.1.0"
edition = "2021"
# Alinhado a byteflow-actors 0.9.21+ (MSRV do runtime).
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
description = "Host-side I/O integration layer for the Byteflow runtime"
repository = "https://github.com/mchael158/byteflow-io"
readme = "README.md"
keywords = ["byteflow", "embedded", "io", "host-await", "runtime"]
categories = ["concurrency", "embedded", "api-bindings"]

[dependencies]
# byteflow-actors 0.9.21+ (Rust import: `byteflow`).
# Workspace embedding: byteflow-actors = { path = "../byteflow" }
byteflow-actors = { git = "https://github.com/mchael158/byteflow-actors.git" }

[dev-dependencies]

[features]
default = []
